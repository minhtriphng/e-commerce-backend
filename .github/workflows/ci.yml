name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write # ← cần để push lên GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # lint là sửa cú pháp
      - name: Lint
        run: npm run lint -- --max-warnings=0

      # tạm thời bỏ qua test (test đôi khi cần db và env)
      - name: Test
        run: npm run test -- --passWithNoTests

      - name: Build
        run: npm run build

      # Setup Buildx — công cụ build Docker nhanh hơn, hỗ trợ cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Chỉ login khi push vào master (không login khi PR)
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build + push
      # - PR: chỉ build (push: false) → verify Dockerfile
      # - master: build + push (push: true) → lưu lên GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . #build từ thư mục hiện tại
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image
        run: docker images
