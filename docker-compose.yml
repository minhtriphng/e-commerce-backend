services:
  app:
    build: . # build từ Dockerfile ở thư mục hiện tại
    container_name: app-ecommerce
    restart: always
    # Bỏ ports ở đây — app chỉ lắng nghe trong network nội bộ
    # nginx sẽ là cửa ngõ duy nhất
    expose:
      - '3000'
    environment:
      PORT: 3000
      # 👇 trỏ sang TÊN SERVICE trong compose, docker tự nối mạng nội bộ
      # FE
      FE_URL: ${FE_URL}
      # DB — trỏ vào tên service trong network
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Redis — trỏ vào tên service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Mail
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      # JWT
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      # VNPay
      VNP_TMN_CODE: ${VNP_TMN_CODE}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET}
      VNP_URL: ${VNP_URL}
      VNP_RETURN_URL: ${VNP_RETURN_URL}
      #Cloudinary
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_KEY: ${CLOUDINARY_KEY}
      CLOUDINARY_SECRET: ${CLOUDINARY_SECRET}
    depends_on:
      postgres:
        condition: service_healthy # đợi postgres thực sự sẵn sàng mới start app
      redis:
        condition: service_started

  postgres:
    image: postgres:15
    container_name: postgres-ecommerce
    restart: always
    ports:
      - '${POSTGRES_PORT}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck: # 👈 THÊM MỚI — bắt buộc cho depends_on phía trên hoạt động
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: redis-ecommerce
    restart: always
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data

  nginx: # 👈 SERVICE MỚI
    image: nginx:alpine
    container_name: nginx-ecommerce
    restart: always
    ports:
      - '80:80' # 👇 nếu muốn đổi cổng ngoài thì '8080:80' chẳng hạn
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
volumes:
  postgres_data:
  redis_data:
